<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120d08">
<title>Raad Delivery</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#100d09;
color:#fff;
font-family:Arial,sans-serif;
}
header{
padding:22px 18px;
background:#19120b;
border-bottom:1px solid #aa843f;
}
.logo{
color:#e6bd69;
font-size:27px;
font-weight:bold;
}
.logo span{color:white}
header p{color:#b9a98c;font-size:13px}
.container{padding:18px}
.welcome{
background:linear-gradient(120deg,#30200d,#17110b);
padding:23px;
border:1px solid #765b2c;
border-radius:18px;
margin-bottom:25px;
}
.welcome h2{color:#f0ca78;margin:0 0 10px}
.welcome p{color:#ddd0b6;font-size:14px}
.section-title{
color:#e8c477;
font-size:19px;
margin:25px 0 15px;
}
.search{
width:100%;
padding:15px;
border-radius:12px;
border:1px solid #544329;
background:#201910;
color:white;
font-size:15px;
}
.restaurants{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}
.restaurant{
background:#201910;
border:1px solid #44351f;
border-radius:14px;
overflow:hidden;
cursor:pointer;
}
.restaurant img{
width:100%;
height:115px;
object-fit:cover;
}
.restaurant h3{
margin:10px;
font-size:15px;
}
.restaurant p{
margin:0 10px 12px;
font-size:12px;
color:#c5ad7d;
}
.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}
.product{
background:#201910;
border:1px solid #49391f;
border-radius:14px;
overflow:hidden;
}
.product img{
width:100%;
height:125px;
object-fit:cover;
}
.product-info{padding:11px}
.product h3{font-size:14px;margin:0 0 8px}
.price{color:#eac477;font-weight:bold}
.add{
width:100%;
margin-top:10px;
padding:10px;
border:0;
border-radius:9px;
background:#c69b4d;
color:#160f06;
font-weight:bold;
}
.cart{
position:fixed;
bottom:0;
left:0;
right:0;
background:#21180e;
border-top:1px solid #b48a42;
padding:14px 18px;
display:flex;
justify-content:space-between;
align-items:center;
}
.cart button{
background:#d3aa5c;
border:0;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
}
.hidden{display:none}
footer{
height:85px;
}
</style>
</head>

<body>

<header>
<div class="logo">RAAD <span>DELIVERY</span></div>
<p>طلبك علينا.. وراحتك تهمنا</p>
</header>

<div class="container">

<div class="welcome">
<h2>أهلاً بك في Raad Delivery</h2>
<p>اختر مطعمك المفضل واطلب وجبتك بكل سهولة.</p>
</div>

<input class="search" id="search"
placeholder="ابحث عن مطعم أو وجبة..."
oninput="searchItems()">

<h2 class="section-title">المطاعم</h2>

<div class="restaurants" id="restaurants">

<div class="restaurant" onclick="showMenu()">
<img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500">
<h3>مطعم تجريبي</h3>
<p>وجبات ومأكولات متنوعة</p>
</div>

<div class="restaurant" onclick="showMenu()">
<img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500">
<h3>مطعم جديد</h3>
<p>أشهى الوجبات</p>
</div>

</div>

<div id="menu" class="hidden">

<h2 class="section-title">قائمة الطعام</h2>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">
<div class="product-info">
<h3>برجر لحم</h3>
<div class="price">25 ريال</div>
<button class="add" onclick="addCart('برجر لحم',25)">إضافة للسلة</button>
</div>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500">
<div class="product-info">
<h3>بيتزا</h3>
<div class="price">30 ريال</div>
<button class="add" onclick="addCart('بيتزا',30)">إضافة للسلة</button>
</div>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500">
<div class="product-info">
<h3>بطاطس</h3>
<div class="price">8 ريال</div>
<button class="add" onclick="addCart('بطاطس',8)">إضافة للسلة</button>
</div>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500">
<div class="product-info">
<h3>وجبة دجاج</h3>
<div class="price">22 ريال</div>
<button class="add" onclick="addCart('وجبة دجاج',22)">إضافة للسلة</button>
</div>
</div>

</div>
</div>
<footer></footer>
</div>

<div class="cart">
<div>
🛒 السلة: <span id="count">0</span>
<br>
<strong id="total">0 ريال</strong>
</div>
<button onclick="checkout()">عرض الطلب</button>
</div>

<script>
let count=0;
let total=0;
let items=[];

function showMenu(){
document.getElementById('menu').classList.remove('hidden');
document.getElementById('menu').scrollIntoView({behavior:'smooth'});
}

function addCart(name,price){
count++;
total+=price;
items.push(name);
document.getElementById('count').textContent=count;
document.getElementById('total').textContent=total+' ريال';
}

function checkout(){
if(count===0){
alert('السلة فارغة');
return;
}
alert(
'تفاصيل طلبك:\\n'+
items.join('\\n')+
'\\n\\nالإجمالي: '+total+' ريال'
);
}

function searchItems(){
let q=document.getElementById('search').value;
document.querySelectorAll('.restaurant').forEach(el=>{
el.style.display=el.innerText.includes(q)?'block':'none';
});
}
</script>

</body>
</html>
